<template>
  <div class="container">
    <div class="card">

      <h1>Esqueceu a senha?</h1>

      <p class="subtitle">
        Digite seu endereço de email e enviaremos um link para redefinir sua senha.
      </p>

      <template if:true={errorMessage}>
          <p style="color: #c23934; font-size: 14px; margin-bottom: 10px;">
              {errorMessage}
          </p>
      </template>

      <lightning-input 
          label="Email" 
          type="email" 
          value={email}
          onchange={handleEmailChange}
          required>
      </lightning-input>

      <button class="primaryButton" onclick={handleResetPassword} style="margin-top: 20px;">
        Resetar
      </button>

    </div>
  </div>
</template>
