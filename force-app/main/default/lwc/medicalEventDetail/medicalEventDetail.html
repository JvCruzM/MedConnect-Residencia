<template>
    <lightning-card title="Detalhes do Evento Médico" icon-name="standard:event">
        <div class="slds-p-around_medium">

            <lightning-tabset>

                <lightning-tab label="Detalhes do Evento" value="event">
                    <lightning-record-view-form
                        record-id={recordId}
                        object-api-name="Medical_Event__c">

                        <div class="slds-grid slds-wrap slds-gutters">
                            <div class="slds-col slds-size_1-of-2">
                                <lightning-output-field field-name="Name__c"></lightning-output-field>
                                <lightning-output-field field-name="Status__c"></lightning-output-field>
                                <lightning-output-field field-name="Start_Date_Time__c"></lightning-output-field>
                                <lightning-output-field field-name="End_Date_Time__c"></lightning-output-field>
                            </div>

                            <div class="slds-col slds-size_1-of-2">
                                <lightning-output-field field-name="Organizers__c"></lightning-output-field>
                                <lightning-output-field field-name="Location__c"></lightning-output-field>
                                <lightning-output-field field-name="Max_Seats__c"></lightning-output-field>
                                <lightning-output-field field-name="Remaining_Seats__c"></lightning-output-field>
                            </div>
                        </div>

                        <div class="slds-m-top_large slds-text-align_right">
                            <lightning-button
                                label="Inscrever-se no Evento"
                                variant="brand"
                                onclick={handleRegister}>
                            </lightning-button>
                        </div>

                    </lightning-record-view-form>
                </lightning-tab>

                <lightning-tab label="Palestrantes" value="speakers">
                    <div class="slds-m-bottom_small slds-text-align_right">
                        <lightning-button
                            label="Novo Palestrante"
                            variant="brand"
                            onclick={handleNewSpeaker}>
                        </lightning-button>
                    </div>

                    <template if:true={speakers}>
                        <lightning-datatable
                            key-field="Id"
                            data={speakers}
                            columns={speakerColumns}
                            hide-checkbox-column>
                        </lightning-datatable>
                    </template>
                </lightning-tab>

                <lightning-tab label="Localização" value="location">
                    <template if:true={locationId}>
                        <lightning-record-view-form
                            record-id={locationId}
                            object-api-name="Location__c">

                            <div class="slds-grid slds-wrap slds-gutters">
                                <div class="slds-col slds-size_1-of-2">
                                    <lightning-output-field field-name="Name"></lightning-output-field>
                                    <lightning-output-field field-name="Street__c"></lightning-output-field>
                                    <lightning-output-field field-name="Landmark__c"></lightning-output-field>
                                </div>

                                <div class="slds-col slds-size_1-of-2">
                                    <lightning-output-field field-name="City__c"></lightning-output-field>
                                    <lightning-output-field field-name="State__c"></lightning-output-field>
                                    <lightning-output-field field-name="Country__c"></lightning-output-field>
                                </div>
                            </div>

                        </lightning-record-view-form>
                    </template>

                    <template if:false={locationId}>
                        <p class="slds-text-color_weak">
                            Nenhum local selecionado para este evento.
                        </p>
                    </template>
                </lightning-tab>

                <lightning-tab label="Participantes" value="attendees">
                    <div class="slds-m-bottom_small slds-text-align_right">
                        <lightning-button
                            label="Novo Participante"
                            variant="brand"
                            onclick={handleNewAttendee}>
                        </lightning-button>
                    </div>

                    <template if:true={attendees}>
                        <lightning-datatable
                            key-field="Id"
                            data={attendees}
                            columns={attendeeColumns}
                            hide-checkbox-column>
                        </lightning-datatable>
                    </template>
                </lightning-tab>

            </lightning-tabset>

        </div>
    </lightning-card>
</template>
