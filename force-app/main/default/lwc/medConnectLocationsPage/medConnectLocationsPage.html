<template>
    <section class="locationsPage">

        <div class="hero">
            <div class="heroHeader">
                <h1>Localizações</h1>

                <template lwc:if={isOrganizer}>
                    <a onclick={handleAddLocation} style="cursor: pointer; display: inline-block; margin-top: 10px;"
                        class="primaryBtn">
                        + Adicionar Local
                    </a>
                </template>
            </div>

            <p>
                Conheça os locais onde os eventos do MedConnect acontecem.
            </p>
        </div>

        <template if:true={errorMessage}>
            <div class="message error" role="alert">
                {errorMessage}
            </div>
        </template>

        <template if:true={successMessage}>
            <div class="message success" role="status">
                {successMessage}
            </div>
        </template>

        <template if:true={hasLocations}>
            <div class="locationsGrid">
                <template for:each={locations} for:item="location">
                    <div class="locationCard" key={location.Id}>

                        <div class="cardHeader">
                            <h2>{location.Name}</h2>

                            <template if:true={location.Verified__c}>
                                <span class="verified">
                                    ✓ Verificado
                                </span>
                            </template>
                        </div>

                        <div class="locationInfo">
                            <p>
                                <strong>Endereço:</strong>
                                {location.Street__c}
                            </p>

                            <p>
                                <strong>Cidade:</strong>
                                {location.City__c}
                            </p>

                            <p>
                                <strong>Estado:</strong>
                                {location.State__c}
                            </p>

                            <p>
                                <strong>País:</strong>
                                {location.Country__c}
                            </p>

                            <p>
                                <strong>CEP:</strong>
                                {location.Postal_Code__c}
                            </p>

                            <p>
                                <strong>Referência:</strong>
                                {location.Landmark__c}
                            </p>
                        </div>

                        <template if:true={location.canManage}>
                            <div class="buttonRow">
                                <button
                                    type="button"
                                    class="editButton"
                                    data-id={location.Id}
                                    onclick={handleEditLocation}>
                                    Editar
                                </button>

                                <button
                                    type="button"
                                    class="deleteButton"
                                    data-id={location.Id}
                                    data-name={location.Name}
                                    onclick={handleDeleteLocation}>
                                    Excluir
                                </button>
                            </div>
                        </template>

                    </div>
                </template>
            </div>
        </template>

        <template if:false={hasLocations}>
            <p>Nenhuma localização encontrada.</p>
        </template>

    </section>
</template>
