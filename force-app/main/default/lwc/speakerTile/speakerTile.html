<template>
    <section class="speakers-section">
        <div class="section-header">
            <h2>Featured Speakers</h2>
            <a href="/speakers">View All Speakers</a>
        </div>

        <div class="speaker-grid">
            <template for:each={speakers} for:item="speaker">
                <article key={speaker.Id} class="speaker-card">
                    <img src={speaker.Profile_URL__c} alt={speaker.Name} class="speaker-photo" />

                    <div>
                        <h3>{speaker.Name}</h3>
                        <p class="specialisation">{speaker.Specialisation__c}</p>
                        <p class="bio">{speaker.About_Me_Specialisation__c}</p>
                    </div>
                </article>
            </template>
        </div>
    </section>
</template>
