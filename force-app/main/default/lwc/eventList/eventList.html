<template>
    <section class="events-section">

        <div class="section-header">
            <h2>Eventos</h2>
            <p>
                Explore eventos médicos ao vivo, workshops e sessões de bem-estar.
            </p>
        </div>

        <div class="search-box">
            <lightning-input
                type="search"
                label="Pesquisar Eventos"
                placeholder="Busque por nome, data ou local..."
                onchange={handleSearch}>
            </lightning-input>
        </div>

        <template if:true={filteredData}>
            <div class="event-grid">

                <template for:each={filteredData} for:item="event">

                    <article key={event.Id} class="event-card">

                        <div class="event-icon">
                            ⚕️
                        </div>

                        <div class="event-content">

                            <p class="event-date">
                                <lightning-formatted-date-time 
                                    value={event.Start_Date_Time__c} 
                                    year="numeric" 
                                    month="2-digit" 
                                    day="2-digit" 
                                    hour="2-digit" 
                                    minute="2-digit"
                                    time-zone="America/Sao_Paulo">
                                </lightning-formatted-date-time>
                            </p>

                            <h3>
                                {event.Name__c}
                            </h3>

                            <p class="event-location">
                                📍 {event.LocationName}
                            </p>

                            <p class="event-seats">
                                {event.Remaining_Seats__c} seats left
                            </p>

                            <a
                                href={event.eventUrl}
                                class="details-button">
                                View Details
                            </a>

                        </div>

                    </article>

                </template>

            </div>
        </template>

        <template if:true={error}>
            <div class="error-box">
                Error loading events.
            </div>
        </template>

    </section>
</template>
