<template>
  <div class="container">
    <div class="card">

      <h1>Login</h1>
      <p class="subtitle">
        Acesse sua conta para gerenciar eventos médicos.
      </p>

      <lightning-input label="Email" type="email" onchange={handleEmailChange}>
      </lightning-input>

      <label class="password-label">Senha</label>

      <div class="password-wrapper">
        <lightning-input type={passwordInputType} variant="label-hidden" value={password}
          onchange={handlePasswordChange}>
        </lightning-input>

        <button type="button" class="eye-button" onclick={togglePasswordVisibility}
          aria-label="Mostrar ou ocultar senha">
          <lightning-icon icon-name={passwordIconName} size="x-small" alternative-text="Mostrar ou ocultar senha">
          </lightning-icon>
        </button>
      </div>

      <template if:true={errorMessage}>
        <p class="error-text" style="color: #ba0517; font-weight: bold; margin-bottom: 12px; text-align: center;">
          {errorMessage}
        </p>
      </template>

      <button class="primaryButton" onclick={handleLoginAction}>
        Entrar
      </button>

      <p class="footerText">
        Não possui uma conta?
        <span style="cursor: pointer; font-weight: bold;" onclick={navigateToRegister}> Cadastrar-se</span>
      </p>
      <p class="footerText">
        Esqueceu sua senha?
        <span style="cursor: pointer; font-weight: bold;" onclick={navigateToForgotPassword}> Recuperar Senha</span>
      </p>

    </div>
  </div>
</template>
