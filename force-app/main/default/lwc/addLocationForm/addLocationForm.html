<template>
    <div class="container">
        <div class="card">
            <h1>{formTitle}</h1>

            <template if:true={errorMessage}>
                <div class="message error" role="alert">
                    {errorMessage}
                </div>
            </template>

            <template if:true={successMessage}>
                <div class="message success" role="status">
                    {successMessage}
                </div>
            </template>

            <template if:true={warningMessage}>
                <div class="message warning" role="status">
                    {warningMessage}
                </div>
            </template>

            <div class="formGrid">
                <div class="fullWidth">
                    <lightning-input label="Nome da Localização" name="Name" value={locationData.Name}
                        onchange={handleChange} required>
                    </lightning-input>
                </div>

                <lightning-input type="text" label="Código Postal / CEP" name="Postal_Code__c"
                    value={locationData.Postal_Code__c} placeholder="Ex: 50000-000" onchange={handlePostalCodeChange}>
                </lightning-input>

                <lightning-combobox name="Country__c" label="País" placeholder="Selecione o país"
                    value={locationData.Country__c} options={countryOptions} onchange={handleChange} required>
                </lightning-combobox>

                <div class="fullWidth">
                    <lightning-input label="Rua" name="Street__c" value={locationData.Street__c} onchange={handleChange}
                        required>
                    </lightning-input>
                </div>

                <lightning-input label="Cidade" name="City__c" value={locationData.City__c} onchange={handleChange}
                    required>
                </lightning-input>

                <lightning-input label="Estado" name="State__c" value={locationData.State__c} onchange={handleChange}
                    required>
                </lightning-input>

                <div class="fullWidth">
                    <lightning-input label="Ponto de Referência" name="Landmark__c" value={locationData.Landmark__c}
                        placeholder="Ex: próximo ao hospital, shopping ou estação" onchange={handleChange}>
                    </lightning-input>
                </div>

                <template if:true={isFetchingCep}>
                    <div class="fullWidth">
                        <span class="cepStatus">Buscando CEP...</span>
                    </div>
                </template>
            </div>

            <button class="saveButton" onclick={handleSave} disabled={isSaving}>
                {saveButtonLabel}
            </button>
        </div>
    </div>
</template>
